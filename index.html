<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUDU MC</title>

    <link rel="stylesheet" href="./style.css">
    <style>
        @import url ('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap');
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#02030a;
    color:white;
    font-family:Poppins,sans-serif;
    overflow-x:hidden;
}

/* =========================
   ANIMATED SPACE BACKGROUND
========================= */
@keyframes nebula{
    from{
        transform:scale(1) rotate(0deg);
    }

    to{
        transform:scale(1.12) rotate(5deg);
    }
}

/* STARS */

.stars{
    position:absolute;
    inset:0;
}
